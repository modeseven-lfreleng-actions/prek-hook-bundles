# Path-specific configurations.
paths:
  .github/workflows/build.yaml:
    ignore:
      # GitHub introduced the self-repository 'uses: $/...' syntax in
      # July 2026, and zizmor's self-repository audit (v1.30.0+) reports
      # the older workspace-relative './' form as a finding. This fork of
      # actionlint (v1.17.0) understands '$/{path}' but rejects a bare
      # '$/', copying an empty-path check from actions/runner#4457 that
      # actions/runner#4669 has since removed. GitHub accepts and runs a
      # bare '$/' for an action at the repository root.
      #
      # The fork returns before loading action.yaml, so ignoring this
      # also skips input and output checks for those steps.
      # kjanat/actionlint#200 fixes it; drop this ignore when a release
      # containing it is pinned (lfreleng-actions/actions-template#253).
      - 'specifying action "\$/" in invalid format because path is missing'
